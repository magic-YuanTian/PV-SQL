[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pvsql"
version = "0.1.0"
description = "PV-SQL: Synergizing Database Probing and Rule-based Verification for Text-to-SQL Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Yuan Tian" },
    { name = "Tianyi Zhang" },
]
keywords = ["text-to-sql", "nl2sql", "llm-agent", "semantic-parsing"]

# The framework is stdlib-only: the language model is injected as a callable.
dependencies = []

[project.optional-dependencies]
# The bundled OpenAI-compatible adapter (pvsql/llm.py).
openai = ["openai>=1.30.0", "tenacity>=8.2.0"]
dotenv = ["python-dotenv>=1.0.0"]

[project.urls]
Paper = "https://aclanthology.org/2026.findings-acl.1286/"
Repository = "https://github.com/magic-YuanTian/PV-SQL"

[tool.setuptools]
packages = ["pvsql"]
